# Docker Compose test environment: one Buildbot master built from this
# repository and two workers built from the pgperffarm-worker
# repository.  See the "Testing with Docker Compose" section in
# README.rst.

services:
  master:
    build:
      context: .
      dockerfile: docker/master/Dockerfile
    environment:
      BUILDBOT_ADMIN: admin@example.com
      BUILDBOT_ADMIN_PASSWORD: admin
      BUILDBOT_URL: http://localhost:8010/
      # Tests attached to every worker; only dbt2 runs without the
      # non-redistributable TPC tools.
      TESTS: dbt2
      WORKER_NAMES: worker1 worker2
      WORKER_PASSWORD: secret
      # The master image bakes a clone of postgres.git at /poll-repo,
      # pinned to a baseline commit, for testing the poller with
      # docker/test-poller.sh.  Set POLL_REPO empty to disable
      # polling, or point it at another repository.
      POLL_REPO: file:///poll-repo
      POLL_INTERVAL: "30"
    ports:
      - "8010:8010"

  worker1:
    build: &worker-build
      context: docker/worker
      args:
        WORKER_REF: main
    environment:
      BUILDMASTER_HOST: master
      WORKER_NAME: worker1
      WORKER_PASSWORD: secret
    depends_on:
      - master
    shm_size: 1gb

  worker2:
    build: *worker-build
    environment:
      BUILDMASTER_HOST: master
      WORKER_NAME: worker2
      WORKER_PASSWORD: secret
    depends_on:
      - master
    shm_size: 1gb
