# -*- python -*-
# ex: set filetype=python:

"""
This is the Buildbot configuration file.
"""

import sys
from buildbot.plugins import changes, schedulers, util

try:
    import settings
except Exception as e:
    print("ERROR: local settings.py not found", file=sys.stderr)
    print(e)
    raise

# PERFORMANCE TESTS

from dbt2 import DBT2PROPERTIES, DBT2STEPS
from dbt3 import DBT3PROPERTIES, DBT3STEPS
from dbt5 import DBT5PROPERTIES, DBT5STEPS
from dbt7 import DBT7PROPERTIES, DBT7STEPS

TESTS = {
        'dbt2': (DBT2PROPERTIES, DBT2STEPS),
        'dbt3': (DBT3PROPERTIES, DBT3STEPS),
        'dbt5': (DBT5PROPERTIES, DBT5STEPS),
        'dbt7': (DBT7PROPERTIES, DBT7STEPS),
        }

builderNames = list(settings.BUILDERS)

c = BuildmasterConfig = {}

# WORKERS

c['workers'] = settings.WORKERS

c['protocols'] = {'pb': {'port': 9989}}

# Test every queued request individually instead of letting Buildbot
# collapse compatible requests into a single build.
c['collapseRequests'] = False

# Report anonymous usage data to the buildbot project unless settings.py
# says otherwise (set it to None to opt out).
c['buildbotNetUsageData'] = getattr(settings, 'BUILDBOT_NET_USAGE_DATA',
                                    'basic')

# CHANGESOURCES

# The repository to poll for changes.  Set POLL_REPO in settings.py to
# poll somewhere else (e.g. a local mirror), or to an empty string to
# disable polling entirely, e.g. in test environments that only use the
# force schedulers.
pollRepo = getattr(settings, 'POLL_REPO',
                   'https://github.com/postgres/postgres.git')

c['change_source'] = []
if pollRepo:
    c['change_source'].append(
            changes.GitPoller(
                pollRepo,
                workdir='gitpoller-postgres',
                branches=True,
                pollInterval=getattr(settings, 'POLL_INTERVAL', 300),
                pollAtLaunch=True,
                )
            )

# SCHEDULERS

properties = {test: props for test, (props, _) in TESTS.items()}

c['schedulers'] = []
c['schedulers'].append(
        schedulers.AnyBranchScheduler(
            name="all",
            treeStableTimer=1,
            builderNames=builderNames,
            change_filter=util.ChangeFilter(
                branch_re=r"^(master|REL_\d+_STABLE)$",
                ),
            fileIsImportant=lambda c: any(f.startswith('src/') for f in c.files),
            )
        )

# Create a ForceScheduler per worker per test so that a test can be started on
# an individual worker instead of all of them, as Buildbot was designed to do.
for builderName, workers in settings.BUILDERS.items():
    for worker in workers:
        c['schedulers'].append(
                schedulers.ForceScheduler(
                    name=f"run-{builderName}-{worker}",
                    builderNames=[f"{builderName}-{worker}"],
                    properties=properties[builderName],
                    )
                )

# Let developers submit a patch for testing with "buildbot try".  Set
# TRY_USERS in settings.py to a list of (user, password) tuples to
# enable it.  The patch is applied to PostgreSQL by the source step,
# and the test parameters come from the worker's test configuration
# files, like a polled build.
tryUsers = getattr(settings, 'TRY_USERS', [])
if tryUsers:
    c['schedulers'].append(
            schedulers.Try_Userpass(
                name="try",
                builderNames=[
                    f"{test}-{worker}"
                    for test, workers in settings.BUILDERS.items()
                    for worker in workers
                    ],
                port=getattr(settings, 'TRY_PORT', 8031),
                userpass=tryUsers,
                )
            )

# BUILDERS

factory = {test: util.BuildFactory(steplist)
           for test, (_, steplist) in TESTS.items()}

c['builders'] = []

# Create a general builder for each test, so that the AnyBranchScheduler will
# trigger a test on every worker.  Then we need a builder for each test allowed
# on each worker in order to trigger a test on a specific worker.
for test, workernames in settings.BUILDERS.items():
    c['builders'].append(
        util.BuilderConfig(
            name=test,
            workernames=workernames,
            factory=factory[test],
        )
    )
    for worker in workernames:
        c['builders'].append(
            util.BuilderConfig(
                name=f"{test}-{worker}",
                workernames=[worker],
                factory=factory[test],
            )
        )

# BUILDBOT SERVICES

c['services'] = []

# PROJECT IDENTITY

c['title'] = "PostgreSQL Perf"
c['titleURL'] = "https://github.com/PGPerfFarm/pgperffarm-buildbot"

c['buildbotURL'] = settings.BUILDBOT_URL

c['www'] = {
        "port": settings.WWW_PORT,
        "auth": util.UserPasswordAuth(settings.ADMINS),
        "authz": util.Authz(
            allowRules=[
                util.AnyControlEndpointMatcher(role="admins"),
                ],
            roleMatchers=[
                util.RolesFromEmails(admins=list(settings.ADMINS)),
                ],
            ),
        "plugins": {},
        }

# DB URL

c['db'] = {
    'db_url': settings.DB_URL,
}
